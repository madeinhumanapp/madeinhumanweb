# Comprovacions del generador i dels connectors amb rgpd-tool (pla del panell, WEB-H09).
# No publica res: diu si el contingut és vàlid, si els formularis envien a rgpd-tool exactament el mateix,
# si la vista prèvia del panell és segura i si cap pàgina infringeix la CSP.
# També corren a la branca «esborrany»: el panell només deixa publicar si aquí surt verd.
name: Comprovacions

on:
  pull_request:
  push:
    branches: [main, esborrany]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Eines de comprovació (Playwright)
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: esquema.json al dia
        run: npm run exportar-esquema -- --comprovar
      - name: Cap HTML al contingut
        run: npm run sense-html
      - name: Generar dist/
        run: npm run construir
      - name: Qualitat (enllaços, JSON-LD, accessibilitat, pes)
        run: npm run qualitat
      - name: Domicili només a l'avís legal
        run: npm run domicili
      - name: Mapa del lloc (sitemap)
        run: npm run sitemap
      - name: Hreflang coherent
        run: npm run hreflang
      - name: Títols i descripcions (límits de Google)
        run: npm run metadades
      - name: Textos legals en castellà
        run: npm run legal-castella
      - name: Markdown (llistes numerades, paràgraf destacat)
        run: npm run markdown
      - name: Pàgines de sector (motor i esborranys)
        run: npm run sectors
      - name: Taula de validació dels esborranys
        run: npm run esborranys
      - name: Qualitat de la construcció amb esborranys
        run: npm run qualitat-esborranys
      - name: Pàgina 404 bilingüe
        run: npm run pagina-404
      - name: Cerca interna
        run: npm run cerca
      - name: llms.txt
        run: npm run llms
      - name: Textos d'interfície (ca i es)
        run: npm run textos
      - name: Notícies (actualitat)
        run: npm run actualitat
      - name: Esquema de les pàgines de servei
        run: npm run serveis
      - name: Imatges i vídeos (media)
        run: npm run media
      - name: Contractes dels formularis amb rgpd-tool
        run: npm run contractes
      - name: Resultat del diagnòstic (semàfor)
        run: npm run diagnostic-resultat
      - name: Selector de reserves (API simulada)
        run: npm run reserva
      - name: Teclat, focus i contrast
        run: npm run teclat
      - name: Informe de registre (prova de l'eina)
        run: npm run registre
      - name: Autotest SaaS (esborrany, només a les vistes prèvies)
        run: npm run autotest-saas
      - name: Vista prèvia del panell
        run: npm run previsualitzacio
      - name: Seguretat de contingut (CSP)
        run: npm run csp
      - name: Fil conductor (capes, text, espurnes, rendiment)
        run: npm run fil
      - name: Portada (notes, premisses, Venn, finestres)
        run: npm run portada
      - name: Pàgina de preguntes freqüents
        run: npm run faq

  visual:
    if: github.ref != 'refs/heads/main'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Eines de comprovació (Playwright)
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Construir main (referència) i la branca actual
        run: |
          git fetch --no-tags origin main
          rm -rf /tmp/main-worktree /tmp/main-dist
          git worktree add --detach /tmp/main-worktree origin/main
          node /tmp/main-worktree/eines/construir.mjs --sortida /tmp/main-dist
          git worktree remove --force /tmp/main-worktree
          npm run construir
      - name: Regressió visual (informativa, 375 i 1280 px)
        run: |
          node proves/visual.mjs --base /tmp/main-dist --amplades 375,1280 --resum-markdown "$GITHUB_STEP_SUMMARY"
