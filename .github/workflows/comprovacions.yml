# Comprovacions del generador i dels connectors amb rgpd-tool (pla del panell, WEB-H09).
# No publica res: diu si el contingut és vàlid, si els formularis envien a rgpd-tool exactament el mateix,
# si la vista prèvia del panell és segura i si cap pàgina infringeix la CSP.
# També corren a la branca «esborrany»: el panell només deixa publicar si aquí surt verd.
name: Comprovacions

on:
  pull_request:
  push:
    branches: [main, esborrany]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Eines de comprovació (Playwright)
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: esquema.json al dia
        run: npm run exportar-esquema -- --comprovar
      - name: Cap HTML al contingut
        run: npm run sense-html
      - name: Generar dist/
        run: npm run construir
      - name: Mapa del lloc (sitemap)
        run: npm run sitemap
      - name: Notícies (actualitat)
        run: npm run actualitat
      - name: Esquema de les pàgines de servei
        run: npm run serveis
      - name: Imatges i vídeos (media)
        run: npm run media
      - name: Contractes dels formularis amb rgpd-tool
        run: npm run contractes
      - name: Vista prèvia del panell
        run: npm run previsualitzacio
      - name: Seguretat de contingut (CSP)
        run: npm run csp
      - name: Fil conductor (capes, text, espurnes, rendiment)
        run: npm run fil
      - name: Portada (notes, premisses, Venn, finestres)
        run: npm run portada
      - name: Pàgina de preguntes freqüents
        run: npm run faq
